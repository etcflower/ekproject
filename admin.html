<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 | EK프로젝트</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- ===== 로그인 화면 ===== -->
    <section id="loginScreen" class="login-screen">
        <div class="login-box">
            <img src="images/logo.png" alt="EK프로젝트" class="login-logo">
            <h1>관리자 로그인</h1>
            <p class="login-desc">세미나 일정을 관리하려면 비밀번호를 입력하세요.</p>
            <form id="loginForm">
                <input type="password" id="loginPassword" placeholder="비밀번호" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary btn-large">로그인</button>
                <p class="login-error" id="loginError"></p>
            </form>
            <a href="index.html" class="login-back"><i class="fas fa-arrow-left"></i> 메인 페이지로</a>
        </div>
    </section>

    <!-- ===== 관리자 화면 ===== -->
    <div id="adminScreen" class="admin-screen" style="display:none;">

        <!-- 관리자 헤더 -->
        <header class="admin-header">
            <div class="admin-header-inner">
                <a href="index.html" class="admin-logo">
                    <img src="images/logo.png" alt="EK프로젝트">
                    <span>관리자</span>
                </a>
                <div class="admin-header-actions">
                    <a href="index.html" class="btn btn-outline-navy" target="_blank">
                        <i class="fas fa-external-link-alt"></i> 사이트 보기
                    </a>
                    <button id="logoutBtn" class="btn btn-outline-navy">
                        <i class="fas fa-sign-out-alt"></i> 로그아웃
                    </button>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-container">

                <!-- 페이지 타이틀 -->
                <div class="admin-page-head">
                    <div>
                        <h1>설명회 일정 관리</h1>
                        <p>메인 페이지의 설명회 카드는 표시 순서(display_order)가 낮은 3개가 자동 노출됩니다.</p>
                    </div>
                    <button id="newSeminarBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 새 일정 등록
                    </button>
                </div>

                <!-- 통계 -->
                <div class="admin-stats">
                    <div class="stat-card">
                        <div class="stat-label">전체 일정</div>
                        <div class="stat-value" id="statTotal">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">접수중</div>
                        <div class="stat-value" id="statOpen">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">예정</div>
                        <div class="stat-value" id="statUpcoming">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">마감/종료</div>
                        <div class="stat-value" id="statClosed">-</div>
                    </div>
                </div>

                <!-- 테이블 -->
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:60px;">순서</th>
                                <th>제목</th>
                                <th style="width:120px;">날짜</th>
                                <th style="width:80px;">시간</th>
                                <th style="width:100px;">상태</th>
                                <th style="width:80px;">정원</th>
                                <th style="width:140px;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="seminarTableBody">
                            <tr><td colspan="7" class="loading-row">
                                <i class="fas fa-spinner fa-spin"></i> 불러오는 중...
                            </td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- ===== 등록/수정 모달 ===== -->
    <div id="seminarModal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-box">
            <div class="modal-head">
                <h2 id="modalTitle">새 일정 등록</h2>
                <button class="modal-close" id="modalCloseBtn"><i class="fas fa-times"></i></button>
            </div>
            <form id="seminarForm" class="modal-form">
                <input type="hidden" id="formId">

                <div class="form-row">
                    <label>제목 <span class="req">*</span></label>
                    <input type="text" id="formTitle" required placeholder="예) EK프로젝트 가맹 설명회 (서울)">
                </div>

                <div class="form-row-grid">
                    <div class="form-row">
                        <label>날짜 <span class="req">*</span></label>
                        <input type="date" id="formDate" required>
                    </div>
                    <div class="form-row">
                        <label>시간</label>
                        <input type="time" id="formTime">
                    </div>
                </div>

                <div class="form-row">
                    <label>장소</label>
                    <input type="text" id="formLocation" placeholder="예) 서울 강남구 본사 대회의실">
                </div>

                <div class="form-row-grid">
                    <div class="form-row">
                        <label>정원</label>
                        <input type="number" id="formCapacity" min="0" placeholder="예) 30">
                    </div>
                    <div class="form-row">
                        <label>표시 순서</label>
                        <input type="number" id="formOrder" min="0" placeholder="낮을수록 먼저 표시 (예: 1)">
                    </div>
                </div>

                <div class="form-row">
                    <label>상태</label>
                    <select id="formStatus">
                        <option value="예정">예정</option>
                        <option value="접수중">접수중</option>
                        <option value="마감">마감</option>
                        <option value="종료">종료</option>
                    </select>
                </div>

                <div class="form-row-grid">
                    <div class="form-row">
                        <label>자세히보기 링크</label>
                        <input type="text" id="formDetailLink" placeholder="# 또는 URL">
                    </div>
                    <div class="form-row">
                        <label>신청 링크</label>
                        <input type="text" id="formApplyLink" placeholder="# 또는 URL">
                    </div>
                </div>

                <div class="form-row">
                    <label>설명</label>
                    <textarea id="formDescription" rows="4" placeholder="세미나에 대한 상세 설명을 입력하세요."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline-navy" id="modalCancelBtn">취소</button>
                    <button type="submit" class="btn btn-primary" id="modalSaveBtn">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
